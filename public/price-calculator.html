<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator - Catalogproai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="appContainer">
        <div class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>Catalogproai</span>
            </div>
            <a class="nav-item" href="dashboard.html"> Home</a>
            <a class="nav-item" href="image-generator.html"> Meesho Image Generator</a>
            <a class="nav-item" href="shipping-label.html"> Shipping Label Export</a>
            <a class="nav-item" href="meesho-lens.html"> Meesho Lens</a>
            <a class="nav-item active" href="price-calculator.html"> Price Calculator</a>
            <a class="nav-item" href="plans.html"> Plans</a>
        </div>

        <div class="main-wrapper">
            <div class="main-content">
                <h2>Profit & Price Calculator</h2>
                <p>Calculate your net margin, return impact, and GST input credit instantly.</p>
                
                <div class="calc-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <div class="input-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px;">
                        <h3>Cost Breakdown</h3>
                        <label>Product Cost (₹):</label>
                        <input type="number" id="prodCost" value="200" style="width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px;">
                        
                        <label>Selling Price (₹):</label>
                        <input type="number" id="sellPrice" value="499" style="width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px;">
                        
                        <label>Shipping Fee (₹):</label>
                        <input type="number" id="shipFee" value="70" style="width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px;">

                        <button onclick="calculateProfit()" class="card-btn btn-orange" style="margin-top: 15px; width: 100%;">Calculate Profit</button>
                    </div>

                    <div class="result-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px;">
                        <h3>Calculation Summary</h3>
                        <div id="calcResults" style="margin-top: 15px; font-size: 18px;">
                            <p>Estimated Net Profit: <strong id="netProfit" style="color: #4ade80;">₹229</strong></p>
                            <p>Profit Margin: <strong id="profitMargin" style="color: #60a5fa;">45.8%</strong></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateProfit() {
            const cost = parseFloat(document.getElementById('prodCost').value) || 0;
            const price = parseFloat(document.getElementById('sellPrice').value) || 0;
            const ship = parseFloat(document.getElementById('shipFee').value) || 0;
            
            const profit = price - cost - ship;
            const margin = price > 0 ? ((profit / price) * 100).toFixed(1) : 0;
            
            document.getElementById('netProfit').innerText = '₹' + profit.toFixed(2);
            document.getElementById('profitMargin').innerText = margin + '%';
        }
    </script>
</body>
</html>
