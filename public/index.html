  <meta charset="UTF-8">

  <title>Catalogproai - Welcome</title>
  <link rel="icon" type="image/png" href="IMG_6768.PNG">
  <meta name="google-site-verification" content="hXjMw02VKgAETLoiui1PJGaohquDJ0pWxtK502M9Xjo">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b2845 0%, #050b14 100%);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .hero-container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-title {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .btn-get-started {
      display: inline-block;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.3s ease;
      margin-bottom: 24px;
    }

    .btn-get-started:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
    }

    .hero-subtitle {
      font-size: 16px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="hero-container">
    <h1 class="hero-title">Keshav Saroha</h1>
    <a href="dashboard.html" class="btn-get-started">Get Started</a>
    <p class="hero-subtitle">Welcome to Catalogproai — Your All-in-One E-Commerce Tools Suite</p>
  </div>
</body>
