<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Catalogproai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        .brand-header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; }
        .brand-header h2 { font-size: 22px; color: #172b4d; font-weight: 700; }
        h3 { font-size: 20px; color: #172b4d; margin-bottom: 8px; }
        .subtitle { color: #6b778c; font-size: 14px; margin-bottom: 24px; }
        .google-btn { width: 100%; padding: 12px; border: 1px solid #dfe1e6; border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-weight: 500; color: #333; }
        .divider { display: flex; align-items: center; margin: 20px 0; color: #8993a4; font-size: 13px; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #dfe1e6; }
        .divider span { padding: 0 10px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #42526e; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #dfe1e6; border-radius: 6px; font-size: 14px; outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: #0052cc; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { background: #0065ff; }
        .signup-text { margin-top: 20px; font-size: 13px; color: #6b778c; }
        .signup-text a { color: #0052cc; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0052cc" stroke-width="2.5">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h2>Catalogproai</h2>
        </div>
        
        <h3>Sign in to Catalogproai</h3>
        <p class="subtitle">Welcome back! Please sign in to continue</p>
        
        <button class="google-btn" onclick="alert('Google Sign-In integration in progress.')">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
        </button>

        <div class="divider"><span>or</span></div>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Email address</label>
                <input type="email" id="userEmail" placeholder="Enter your email address" required>
            </div>
            
            <button type="submit" id="btnText" class="submit-btn">Continue &#8250;</button>
        </form>

        <p class="signup-text">Don't have an account? <a href="#" onclick="alert('Enter email above to sign up.')">Sign up</a></p>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('userEmail').value;
            const btn = document.getElementById('btnText');
            
            btn.innerText = "Sending OTP...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                btn.innerText = "Continue ›";
                btn.disabled = false;

                if (data.success) {
                    const otp = prompt("OTP aapke email par bhej diya gaya hai. 6-digit OTP darj karein:");
                    if (otp) {
                        const vRes = await fetch('/api/verify-otp', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, otp })
                        });
                        const vData = await vRes.json();
                        if (vData.success) {
                            alert("Login Successful!");
                            window.location.href = "/";
                        } else {
                            alert(vData.message || "Galat OTP!");
                        }
                    }
                } else {
                    alert(data.message);
                }
            } catch (err) {
                btn.innerText = "Continue ›";
                btn.disabled = false;
                alert("Server Connection Error!");
            }
        }
    </script>
</body>
</html>
