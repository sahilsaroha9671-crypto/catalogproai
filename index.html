<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatalogPro AI - Meesho Label Cropper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background-color: #f8fafc; color: #1e293b; overflow: hidden; }

        .sidebar { width: 260px; background-color: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 20px 15px; }
        .brand { font-size: 20px; font-weight: 700; color: #2563eb; padding: 10px 15px; margin-bottom: 25px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; font-size: 14px; font-weight: 500; color: #64748b; border-radius: 8px; margin-bottom: 4px; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background-color: #eff6ff; color: #2563eb; font-weight: 600; }

        .main-content { flex: 1; overflow-y: auto; padding: 40px; }
        .header h1 { font-size: 28px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        .header p { color: #64748b; font-size: 15px; margin-bottom: 25px; }

        .cropper-box { background: white; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 30px; max-width: 650px; text-align: center; }
        .cropper-box:hover { border-color: #2563eb; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }

        .btn-action { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
        .btn-action:hover { background-color: #1d4ed8; }
        .status-msg { margin-top: 15px; font-size: 14px; font-weight: 600; color: #16a34a; }
        #canvasContainer { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">CatalogPro AI</div>
        <div class="nav-item active">🏷️ Meesho Label Cropper</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Meesho Smart Label Cropper</h1>
            <p>Upload Meesho shipping PDFs to crop labels cleanly and stack 2-per-page for printing.</p>
        </div>

        <div class="cropper-box">
            <div class="form-group">
                <label>Layout & Orientation Mode:</label>
                <select id="layoutMode">
                    <option value="horizontal">2 Labels Per Page (Horizontal Stack)</option>
                    <option value="vertical">2 Labels Per Page (Vertical Stack)</option>
                    <option value="thermal">4x6 Thermal Printer Single Label</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Meesho Shipping PDF:</label>
                <input type="file" id="pdfUpload" accept="application/pdf">
            </div>

            <button class="btn-action" onclick="processMeeshoPDF()">Crop & Download PDF</button>
            <div id="status" class="status-msg"></div>
        </div>
    </div>

    <div id="canvasContainer"><canvas id="pdfCanvas"></canvas></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function processMeeshoPDF() {
            const fileInput = document.getElementById('pdfUpload');
            const layoutMode = document.getElementById('layoutMode').value;
            const status = document.getElementById('status');

            if (!fileInput.files[0]) {
                alert('Pehle Meesho PDF file select karein!');
                return;
            }

            status.innerText = "PDF Process aur Crop ho rahi hai...";

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            const { jsPDF } = window.jspdf;
            let outPdf;

            if (layoutMode === 'thermal') {
                outPdf = new jsPDF({ orientation: 'portrait', unit: 'in', format: [4, 6] });
            } else {
                outPdf = new jsPDF({ orientation: 'portrait', unit: 'in', format: 'a4' });
            }

            let labelsOnPage = 0;

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.5 });

                const canvas = document.getElementById('pdfCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                // Exact Crop Box Coordinates for Meesho Label Segment
                let cropX = 0;
                let cropY = 0;
                let cropWidth = canvas.width;
                let cropHeight = canvas.height * 0.46; // Top-half label area

                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = cropWidth;
                cropCanvas.height = cropHeight;
                const cropCtx = cropCanvas.getContext('2d');
                cropCtx.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

                let finalImgData;

                if (layoutMode === 'horizontal') {
                    // Rotate Canvas 90 degrees for wide layout
                    const rotateCanvas = document.createElement('canvas');
                    rotateCanvas.width = cropHeight;
                    rotateCanvas.height = cropWidth;
                    const rotateCtx = rotateCanvas.getContext('2d');

                    rotateCtx.translate(rotateCanvas.width / 2, rotateCanvas.height / 2);
                    rotateCtx.rotate(90 * Math.PI / 180);
                    rotateCtx.drawImage(cropCanvas, -cropWidth / 2, -cropHeight / 2);

                    finalImgData = rotateCanvas.toDataURL('image/jpeg', 1.0);
                } else {
                    finalImgData = cropCanvas.toDataURL('image/jpeg', 1.0);
                }

                if (layoutMode === 'thermal') {
                    if (i > 1) outPdf.addPage([4, 6], 'portrait');
                    outPdf.addImage(finalImgData, 'JPEG', 0.1, 0.1, 3.8, 5.8);
                } else {
                    if (labelsOnPage === 2) {
                        outPdf.addPage('a4', 'portrait');
                        labelsOnPage = 0;
                    }

                    if (layoutMode === 'horizontal') {
                        let yPos = labelsOnPage === 0 ? 0.4 : 5.8;
                        outPdf.addImage(finalImgData, 'JPEG', 0.5, yPos, 7.2, 5.2);
                    } else {
                        let yPos = labelsOnPage === 0 ? 0.4 : 5.8;
                        outPdf.addImage(finalImgData, 'JPEG', 0.5, yPos, 7.2, 5.0);
                    }
                    labelsOnPage++;
                }
            }

            outPdf.save(`meesho_cropped_labels.pdf`);
            status.innerText = "Done! Cropped PDF Download ho gayi hai.";
        }
    </script>
</body>
</html>
