<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatalogPro AI - Meesho Shipping Optimizer</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #1e3a8a; font-size: 24px; margin-bottom: 5px; text-align: center; }
        p.subtitle { text-align: center; color: #6b7280; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #374151; }
        select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: #fff; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; text-align: center; padding-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card img { width: 100%; height: 320px; object-fit: contain; background: #fafafa; }
        .tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin: 10px 0 5px; }
        .price { font-size: 18px; font-weight: 700; color: #16a34a; margin-bottom: 10px; }
        .download-btn { display: inline-block; width: 85%; padding: 8px; background: #059669; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; }
        .download-btn:hover { background: #047857; }
    </style>
</head>
<body>

<div class="container">
    <h1>CatalogPro AI</h1>
    <p class="subtitle">Optimize Images for Lower Meesho Shipping Rates (Lens Bypass)</p>

    <div class="form-group">
        <label>Select Category:</label>
        <select id="category">
            <option value="Kurtis">Kurtis / Dresses</option>
            <option value="Sarees">Sarees</option>
            <option value="Footwear">Footwear</option>
            <option value="Western">Western Wear</option>
        </select>
    </div>

    <div class="form-group">
        <label>Upload Product Image:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <button onclick="processImages()">Generate Optimized Images</button>

    <div class="grid" id="resultGrid"></div>
</div>

<script>
    function processImages() {
        const input = document.getElementById('imageInput');
        const grid = document.getElementById('resultGrid');
        const category = document.getElementById('category').value;

        if (!input.files || !input.files[0]) {
            alert('Kripya pehle ek image select karein!');
            return;
        }

        grid.innerHTML = '<p style="text-align:center; width:100%;">Processing & Optimizing Image Metadata...</p>';

        const file = input.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                grid.innerHTML = '';
                
                // Borders config to bypass Lens AI Detection
                const styles = [
                    { border: '#be185d', label: 'SPECIAL OFFER', rate: '₹60' },
                    { border: '#0284c7', label: 'BEST SELLER', rate: '₹64' },
                    { border: '#d97706', label: 'PREMIUM QUALITY', rate: '₹62' }
                ];

                styles.forEach((style, index) => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Fixed standard square canvas for Meesho Lens optimization
                    canvas.width = 1000;
                    canvas.height = 1000;

                    // Fill canvas background
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 1000, 1000);

                    // Outer Lens-Bypass Colored Frame
                    ctx.lineWidth = 30;
                    ctx.strokeStyle = style.border;
                    ctx.strokeRect(15, 15, 970, 970);

                    // Inner Canvas Optimization & Scaling
                    const scale = Math.min(880 / img.width, 880 / img.height);
                    const x = (1000 - img.width * scale) / 2;
                    const y = (1000 - img.height * scale) / 2;
                    ctx.drawImage(img, x, y, img.width * scale, img.height * scale);

                    // Badge Overlay
                    ctx.fillStyle = style.border;
                    ctx.fillRect(40, 900, 320, 50);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(style.label, 200, 933);

                    // Strip Metadata & Generate Optimized JPEG
                    const optimizedDataUrl = canvas.toDataURL('image/jpeg', 0.88);

                    // Append Result
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${optimizedDataUrl}">
                        <div><span class="tag">${category}</span></div>
                        <div style="font-size:12px; color:#6b7280; margin-top:4px;">ESTIMATED SHIPPING RATE</div>
                        <div class="price">${style.rate}</div>
                        <a href="${optimizedDataUrl}" download="meesho_optimized_${index + 1}.jpg" class="download-btn">Download Image</a>
                    `;
                    grid.appendChild(card);
                });
            };
        };

        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
